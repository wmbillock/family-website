name: Build & Deploy
on:
  push:
    branches: [master]
  schedule:
    # One durable queue worker. Off the top of the hour; GitHub timing is best-effort.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: family-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued workers process current master rather than an older scheduled SHA.
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate queue and check live output
        id: queue
        working-directory: ./billock-org
        run: |
          npm run test:blog
          node scripts/blog-queue.cjs check
      - name: Install & Build
        if: github.event_name == 'push' || steps.queue.outputs.deploy == 'true'
        working-directory: ./billock-org
        run: |
          npm ci
          npm run build
      - name: Deploy via SFTP
        if: github.event_name == 'push' || steps.queue.outputs.deploy == 'true'
        uses: Creepios/sftp-action@v1.0.3
        with:
          host: home98969401.1and1-data.host
          port: 22
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          localPath: ./billock-org/build/
          remotePath: ./billock/
      - name: Verify every generated blog file
        if: github.event_name == 'push' || steps.queue.outputs.deploy == 'true'
        working-directory: ./billock-org
        run: node scripts/blog-queue.cjs verify
